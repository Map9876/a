name: Build Network WinPE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows ADK + WinPE addon (full)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289980" -OutFile "$env:TEMP\adksetup.exe"
          Start-Process "$env:TEMP\adksetup.exe" -ArgumentList "/quiet /features +" -Wait
          Write-Host "ADK (full) installed"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289981" -OutFile "$env:TEMP\adkwinpe.exe"
          Start-Process "$env:TEMP\adkwinpe.exe" -ArgumentList "/quiet" -Wait
          Write-Host "WinPE addon installed"
          $oscd = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Recurse -Filter oscdimg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host ("oscdimg found: " + ($null -ne $oscd))

      - name: Stage WinPE working dir (manual copy, no copype)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $pe = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment"
          $media = "$pe\amd64\Media"
          $wim   = "$pe\amd64\en-us\winpe.wim"
          if (-not (Test-Path $wim)) { Write-Error "winpe.wim missing"; exit 1 }
          New-Item C:\winpe -ItemType Directory -Force | Out-Null
          New-Item C:\winpe\mount -ItemType Directory -Force | Out-Null
          Copy-Item $media C:\winpe\media -Recurse -Force
          New-Item C:\winpe\media\sources -ItemType Directory -Force | Out-Null
          Copy-Item $wim C:\winpe\media\sources\boot.wim -Force
          Write-Host ("boot.wim exists: " + (Test-Path C:\winpe\media\sources\boot.wim))

      - name: Export third-party drivers (WiFi vendor drivers)
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\drv -Force | Out-Null
          dism /online /export-driver /destination:C:\drv
          Write-Host ("exported inf count: " + (Get-ChildItem C:\drv -Recurse -Filter *.inf).Count)

      - name: Mount + add network/WiFi/RNDIS/PowerShell + inject drivers
        shell: pwsh
        run: |
          $m = "C:\winpe\mount"
          New-Item -ItemType Directory $m -Force | Out-Null
          dism /Mount-Image /ImageFile:C:\winpe\media\sources\boot.wim /Index:1 /MountDir:$m
          $oc = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\amd64\WinPE_OCs"
          $comps = @("WinPE-WMI","WinPE-NetFX","WinPE-PowerShell","WinPE-Dot3Svc","WinPE-WLAN","WinPE-WLAN-WoW64","WinPE-RNDIS","WinPE-RNDIS-WoW64")
          foreach ($c in $comps) {
            $cab = "$oc\$c.cab"
            if (Test-Path $cab) {
              dism /Image:$m /Add-Package /PackagePath:$cab
              $loc = "$oc\en-us\$c" + "_en-us.cab"
              if (Test-Path $loc) { dism /Image:$m /Add-Package /PackagePath:$loc }
            } else { Write-Host ("SKIP (no cab): $c") }
          }
          Get-ChildItem "$oc" -Filter "WinPE-WLAN*.cab" -ErrorAction SilentlyContinue | ForEach-Object {
            $p = $_.FullName
            Write-Host ("adding extra: " + $_.Name)
            dism /Image:$m /Add-Package /PackagePath:"$p"
          }
          Write-Host "components added"
          dism /Image:$m /Add-Driver /Driver:C:\drv /Recurse
          Write-Host "third-party drivers injected"
          dism /Unmount-Image /MountDir:$m /Commit
          Write-Host "committed"

      - name: Build ISO (direct oscdimg)
        shell: pwsh
        run: |
          $oscd = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Recurse -Filter oscdimg.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $oscd) { Write-Error "oscdimg not found"; exit 1 }
          $etfs = "C:\winpe\media\boot\etfsboot.com"
          $efi  = "C:\winpe\media\efi\microsoft\boot\efisys.bin"
          if (-not (Test-Path $etfs)) { Write-Error "etfsboot.com missing"; exit 1 }
          if (-not (Test-Path $efi))  { Write-Error "efisys.bin missing"; exit 1 }
          $bd = ("2#p0,e,b" + $etfs + "#pEF,e,b" + $efi)
          Write-Host ("oscdimg: " + $oscd)
          & $oscd -bootdata:$bd -u1 -udfver102 C:\winpe\media C:\winpe.iso
          Write-Host ("iso size: " + (Get-Item C:\winpe.iso).Length)

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: winpe-iso
          path: C:\winpe.iso
          if-no-files-found: error
