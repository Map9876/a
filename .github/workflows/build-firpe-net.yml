name: Add RNDIS+Network to FirPE

on:
  workflow_dispatch:
  push:
    branches: [add-rndis]

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7-Zip + ADK + WinPE addon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 7-Zip (用于从 FAT 超级软盘镜像抽 wim)
          Invoke-WebRequest -Uri "https://7-zip.org/a/7z2408-x64.exe" -OutFile "$env:TEMP\7z.exe"
          Start-Process "$env:TEMP\7z.exe" -ArgumentList "/S" -Wait
          # ADK 完整 + WinPE 插件
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289980" -OutFile "$env:TEMP\adksetup.exe"
          Start-Process "$env:TEMP\adksetup.exe" -ArgumentList "/quiet /features +" -Wait
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289981" -OutFile "$env:TEMP\adkwinpe.exe"
          Start-Process "$env:TEMP\adkwinpe.exe" -ArgumentList "/quiet" -Wait
          $seven = Get-ChildItem "C:\Program Files\7-Zip\7z.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host ("7z: " + $seven.FullName)
          $oscd = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Recurse -Filter oscdimg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host ("oscdimg found: " + ($null -ne $oscd))

      - name: Clone cnb repo (token Basic auth) + pull only FirPE image
        shell: pwsh
        run: |
          # GitHub runner 在公网，cnb 的 LFS 对象必须带令牌；用 Basic 鉴权嵌 URL
          # --no-checkout 避免检出无关大 LFS 文件(如 llm.mnn.weight)触发 smudge 失败
          $tok="${{ secrets.CNB_TOKEN }}"
          git clone --depth 1 --filter=blob:none --no-checkout "https://kfc50:$tok@cnb.cool/kfc50/vllm6.git" frepo
          cd frepo
          git lfs install
          git lfs fetch --include='downloads/winpe/FirPE-V2.1.1.img'
          git checkout HEAD -- downloads/winpe/FirPE-V2.1.1.img
          $f = "downloads/winpe/FirPE-V2.1.1.img"
          Write-Host ("FirPE size: " + (Get-Item $f).Length)

      - name: Extract 11PEX64.WIM from FirPE image (7-Zip)
        shell: pwsh
        run: |
          $seven = Get-ChildItem "C:\Program Files\7-Zip\7z.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          New-Item extracted -ItemType Directory -Force | Out-Null
          & $seven.FullName x "frepo/downloads/winpe/FirPE-V2.1.1.img" -oextracted "BOOT/11PEX64.WIM" -y
          $wim = "extracted\BOOT\11PEX64.WIM"
          if (-not (Test-Path $wim)) { Write-Error "wim not extracted"; exit 1 }
          Write-Host ("wim size: " + (Get-Item $wim).Length)

      - name: DISM mount + add RNDIS + network packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $oc = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\amd64\WinPE_OCs"
          $wim = "extracted\BOOT\11PEX64.WIM"
          $m = "C:\mount"
          New-Item $m -ItemType Directory -Force | Out-Null
          dism /Mount-Image /ImageFile:$wim /Index:1 /MountDir:$m
          $cabs = @('WinPE-RNDIS','WinPE-RNDIS-WoW64','WinPE-WLAN','WinPE-WLAN-WoW64','WinPE-Dot3Svc','WinPE-PowerShell','WinPE-NetFx','WinPE-WMI')
          foreach ($c in $cabs) {
            $p = "$oc\$c.cab"
            if (Test-Path $p) {
              Write-Host "== adding $c =="
              dism /Image:$m /Add-Package /PackagePath:$p
            } else { Write-Host "skip (missing) $c" }
          }
          # 验证 RNDIS 驱动
          $r = Get-ChildItem "$m\Windows\System32\drivers" -Filter usb8023y.sys -ErrorAction SilentlyContinue
          Write-Host ("usb8023y.sys present after add: " + ($null -ne $r))
          dism /Unmount-Image /MountDir:$m /Commit

      - name: Upload serviced WIM
        uses: actions/upload-artifact@v4
        with:
          name: firpe-11pex64-net
          path: extracted/BOOT/11PEX64.WIM
          retention-days: 7
